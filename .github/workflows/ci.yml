name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install scons

      - name: Native unit test
        run: scripts/test_native.sh

      - name: License scan
        run: scripts/test_license_scan.sh

      - name: Fetch Godot 4.7
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT_BIN=$(find /tmp/godot -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Fetch godot-cpp
        run: |
          git clone https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        run: GODOT_CPP_DIR=.deps/godot-cpp scons target=template_debug platform=linux

      - name: Headless smoke
        run: |
          scripts/run_headless_smoke.sh --output build/headless_smoke.json --frames 5
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["native_probe"])')" = "47"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["simulated_frames"])')" = "5"
