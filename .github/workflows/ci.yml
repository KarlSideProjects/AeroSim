name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.out-of-scope/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.out-of-scope/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gut-recovery-shadow:
    continue-on-error: true
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Clean self-hosted workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" ubuntu:24.04 \
            bash -lc 'find /work -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set job-local tool paths
        run: |
          tool_root="$RUNNER_TEMP/aerosim-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$tool_root"
          mkdir -p "$tool_root"
          repo_key="${GITHUB_REPOSITORY//\//-}"
          artifact_root="${AEROSIM_CI_ARTIFACT_ROOT:-$HOME/aerosim-ci-artifacts}"
          artifact_run_dir="$artifact_root/$repo_key/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifact_run_dir"
          scripts/prune_ci_artifacts.sh "$artifact_root/$repo_key" "${AEROSIM_CI_ARTIFACT_KEEP:-20}" "$artifact_run_dir"
          echo "AEROSIM_TOOL_ROOT=$tool_root" >> "$GITHUB_ENV"
          echo "AEROSIM_CI_ARTIFACT_RUN_DIR=$artifact_run_dir" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$tool_root/xdg-cache" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$tool_root/xdg-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$tool_root/xdg-data" >> "$GITHUB_ENV"

      - name: Fetch Godot 4.7
        run: |
          godot_dir="$AEROSIM_TOOL_ROOT/godot"
          godot_zip="$AEROSIM_TOOL_ROOT/godot.zip"
          godot_url=https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_sha256=0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
          scripts/download_release_asset.sh "$godot_url" "$godot_zip" sha256 "$godot_sha256"
          unzip -q "$godot_zip" -d "$godot_dir"
          echo "GODOT_BIN=$(find "$godot_dir" -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"

      - name: GUT recovery-mode shadow
        run: scripts/run_gut_tests.sh --recovery-mode

      - name: Store GUT recovery evidence locally
        if: always()
        run: |
          install -d "$AEROSIM_CI_ARTIFACT_RUN_DIR/gut-recovery-shadow"
          cp -a build/gut/. "$AEROSIM_CI_ARTIFACT_RUN_DIR/gut-recovery-shadow/"
          echo "::notice::Stored GUT recovery evidence in $AEROSIM_CI_ARTIFACT_RUN_DIR"

  linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Clean self-hosted workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" ubuntu:24.04 \
            bash -lc 'find /work -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set job-local tool paths
        run: |
          tool_root="$RUNNER_TEMP/aerosim-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$tool_root"
          mkdir -p "$tool_root"
          repo_key="${GITHUB_REPOSITORY//\//-}"
          artifact_root="${AEROSIM_CI_ARTIFACT_ROOT:-$HOME/aerosim-ci-artifacts}"
          artifact_run_dir="$artifact_root/$repo_key/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_job_dir="$artifact_run_dir/$GITHUB_JOB"
          mkdir -p "$artifact_job_dir"
          scripts/prune_ci_artifacts.sh "$artifact_root/$repo_key" "${AEROSIM_CI_ARTIFACT_KEEP:-20}" "$artifact_run_dir"
          echo "AEROSIM_TOOL_ROOT=$tool_root" >> "$GITHUB_ENV"
          echo "AEROSIM_CI_ARTIFACT_RUN_DIR=$artifact_run_dir" >> "$GITHUB_ENV"
          echo "AEROSIM_CI_ARTIFACT_JOB_DIR=$artifact_job_dir" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$tool_root/xdg-cache" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$tool_root/xdg-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$tool_root/xdg-data" >> "$GITHUB_ENV"
          echo "GODOT_CPP_DIR=$tool_root/godot-cpp" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: license_server/requirements.lock

      - name: Install build tools
        run: |
          mkdir -p "$AEROSIM_TOOL_ROOT/bin"
          mkdir -p "$AEROSIM_TOOL_ROOT/tmp"
          TMPDIR="$AEROSIM_TOOL_ROOT/tmp" python3 -m pip install --target "$AEROSIM_TOOL_ROOT/python-packages" scons numpy
          printf '%s\n' '#!/usr/bin/env sh' \
            'PYTHONPATH="$AEROSIM_TOOL_ROOT/python-packages${PYTHONPATH:+:$PYTHONPATH}"' \
            'export PYTHONPATH' \
            'exec python3 -c "from SCons.Script.Main import main; main()" "$@"' > "$AEROSIM_TOOL_ROOT/bin/scons"
          chmod +x "$AEROSIM_TOOL_ROOT/bin/scons"
          echo "TMPDIR=$AEROSIM_TOOL_ROOT/tmp" >> "$GITHUB_ENV"
          echo "$AEROSIM_TOOL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Python pinned oracle cache unit test
        run: PYTHONPATH="$AEROSIM_TOOL_ROOT/python-packages" python3 tests/test_pinned_oracle.py

      - name: Native unit test
        env:
          AEROSIM_REPLAY_ARTIFACT: build/replay_terminal_state.json
          AEROSIM_A3_ORACLE_CASES: build/a3_oracle_cases.csv
          AEROSIM_A4_A5_ORACLE_CASES: build/a4_a5_oracle_cases.csv
        run: scripts/test_native.sh

      - name: Python A3 oracle
        run: PYTHONPATH="$AEROSIM_TOOL_ROOT/python-packages" scripts/check_a3_oracle.py build/a3_oracle_cases.csv

      - name: Python A4/A5 oracle
        run: PYTHONPATH="$AEROSIM_TOOL_ROOT/python-packages" scripts/check_a4_a5_oracle.py build/a4_a5_oracle_cases.csv

      - name: Hardcoded airframe constant scan
        run: scripts/check_hardcoded_airframe_constants.sh

      - name: UI localization catalog and sink scan
        run: python3 scripts/check_ui_localization.py

      - name: Shared Industrial Yard asset check
        run: |
          scripts/test_shared_map_assets.sh
          scripts/check_shared_map_assets.sh

      - name: Third-party Terrain3D region integrity
        run: python3 scripts/check_third_party_terrain_integrity.py

      - name: Store Linux replay artifact locally
        run: |
          install -D build/replay_terminal_state.json \
            "$AEROSIM_CI_ARTIFACT_RUN_DIR/replay-linux/replay_terminal_state.json"
          echo "::notice::Stored replay-linux in $AEROSIM_CI_ARTIFACT_RUN_DIR"

      - name: License scan
        run: scripts/test_license_scan.sh

      - name: License server locked runtime closure
        run: scripts/test_license_dependencies.sh

      - name: Ubuntu release artifact audit unit test
        run: python3 -m unittest tests.test_release_notice_artifacts.UbuntuReleaseArtifactAuditTest

      - name: Delivery drill test
        run: scripts/test_delivery_drill.sh

      - name: License server API test
        run: build/license-venv/bin/python -m unittest license_server.test_license_server

      - name: Performance report unit test
        run: python3 tests/test_performance_report.py

      - name: Fetch Godot 4.7
        run: |
          godot_dir="$AEROSIM_TOOL_ROOT/godot"
          godot_zip="$AEROSIM_TOOL_ROOT/godot.zip"
          rm -rf "$godot_dir" "$godot_zip"
          godot_url=https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          godot_sha256=0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
          scripts/download_release_asset.sh "$godot_url" "$godot_zip" sha256 "$godot_sha256"
          unzip -q "$godot_zip" -d "$godot_dir"
          echo "GODOT_BIN=$(find "$godot_dir" -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Fetch godot-cpp
        run: |
          rm -rf "$GODOT_CPP_DIR"
          git clone https://github.com/godotengine/godot-cpp.git "$GODOT_CPP_DIR"
          git -C "$GODOT_CPP_DIR" checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        run: scons target=template_debug platform=linux

      - name: Record Linux debug artifact provenance
        run: |
          artifact=build/native_debug_artifact.json
          extension=bin/libaerosim_native.linux.template_debug.x86_64.so
          test -s "$extension"
          native_source_sha256="$({ find src/native -type f -print0; printf 'SConstruct\0'; } | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          python3 - "$artifact" "$extension" "$(git rev-parse HEAD)" "$native_source_sha256" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          artifact = Path(sys.argv[1])
          extension = Path(sys.argv[2])
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(json.dumps({
              "commit_sha": sys.argv[3],
              "gdextension_path": str(extension),
              "gdextension_sha256": hashlib.sha256(extension.read_bytes()).hexdigest(),
              "native_source_sha256": sys.argv[4],
          }, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Exported localization smoke
        run: |
          mkdir -p build/export-smoke
          "$GODOT_BIN" --headless --path . --export-pack "Linux Desktop" build/export-smoke/AeroSim.pck
          "$GODOT_BIN" --headless --main-pack build/export-smoke/AeroSim.pck \
            --script res://tests/headless/localization_export_smoke.gd

      - name: Industrial Yard renderer smoke
        run: scripts/test_industrial_yard_renderers.sh

      - name: Terrain3D dependency smoke
        run: scripts/test_terrain3d_dependency.sh

      - name: GUT GDScript unit tests
        env:
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: scripts/run_gut_tests.sh

      - name: Native atomic boundary negative process
        env:
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: scripts/test_native_atomic_boundary.sh

      - name: Headed acceptance (Xvfb + lavapipe)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: scripts/run_headed_acceptance.sh --xvfb

      - name: Complete-session replay integration
        env:
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: scripts/test_replay_integration.sh

      - name: AirSim pinned client RPC integration
        run: scripts/test_airsim_rpc_client.sh

      - name: Performance harness smoke (Xvfb + lavapipe)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          AEROSIM_REQUIRED_GPU_ADAPTER: llvmpipe
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: xvfb-run -a python3 tests/test_performance_runner.py

      - name: Store headed screenshots locally
        if: ${{ always() && hashFiles('build/headed/**') != '' }}
        run: |
          install -d "$AEROSIM_CI_ARTIFACT_RUN_DIR/headed-linux"
          cp -a build/headed/. "$AEROSIM_CI_ARTIFACT_RUN_DIR/headed-linux/"
          echo "::notice::Stored headed-linux screenshots in $AEROSIM_CI_ARTIFACT_RUN_DIR"

      - name: Headless physics qualification
        env:
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: |
          scripts/run_headless_smoke.sh --output build/headless_smoke.json --csv-output build/headless_trajectory.csv --seconds 60
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["native_probe"])')" = "47"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["physics_ticks_per_second"])')" = "240"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["simulated_frames"])')" = "14400"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["desktop_substep_hz"])')" = "1000"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["desktop_substeps"])')" = "60000"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["mobile_substeps_1s"])')" = "500"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["imu_public_path"])')" = "True"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["a4_a5_public_path"])')" = "True"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["collision_public_path"])')" = "True"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["jolt_collision_handoff"])')" = "True"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["jolt_collision_trials"])')" = "802"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["hardware_config_public_path"])')" = "True"
          test -s build/headless_trajectory.csv
          python3 - <<'PY'
          import csv, json, math
          with open("build/headless_smoke.json", encoding="utf-8") as f:
              data = json.load(f)
          assert "KeyboardProfile" in data["input_fallback_status"]
          assert "non-sim" in data["input_fallback_status"]
          with open("build/headless_trajectory.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == data["simulated_frames"] == 14400
          last = rows[-1]
          assert abs(float(last["time_s"]) - 60.0) <= 1e-9
          assert int(float(last["substeps"])) == 60000
          qnorm = math.sqrt(sum(float(last[key]) ** 2 for key in (
              "orientation_x", "orientation_y", "orientation_z", "orientation_w"
          )))
          assert abs(qnorm - 1.0) <= 1e-6
          PY

      - name: Test parallel release asset downloader
        run: scripts/test_parallel_release_download.sh

      - name: Install Godot export templates
        run: |
          templates_archive="$AEROSIM_TOOL_ROOT/godot-export-templates.tpz"
          templates_unpack_dir="$AEROSIM_TOOL_ROOT/godot-export-templates"
          templates_dir="$XDG_DATA_HOME/godot/export_templates/4.7.stable"
          templates_url=https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          templates_sha512=1035dfde4edcc2472bb0c0b9610ce3ee9302642c2b9957e9066372f9f6bb759ab250c8887551a66f0bc5f51bbd9a58bb45e33a0f29844e97615a9b1138c1120e
          AEROSIM_DOWNLOAD_PARALLELISM=16 \
            scripts/download_release_asset.sh "$templates_url" "$templates_archive" sha512 "$templates_sha512"
          rm -rf "$templates_unpack_dir" "$templates_dir"
          mkdir -p "$templates_unpack_dir" "$templates_dir"
          unzip -q "$templates_archive" -d "$templates_unpack_dir"
          cp -a "$templates_unpack_dir/templates/." "$templates_dir/"

      - name: Build Linux release GDExtension
        run: scons target=template_release platform=linux

      - name: Export Linux release artifact
        run: scripts/export_linux_release.sh

      - name: Installed-package replay integration
        env:
          AEROSIM_EXPORTED: true
          GODOT_BIN: build/release/AeroSim-linux/AeroSim.x86_64
        run: scripts/test_replay_integration.sh

      - name: Store Linux release artifact locally
        run: |
          install -D build/release/AeroSim-linux.zip \
            "$AEROSIM_CI_ARTIFACT_RUN_DIR/release-linux/AeroSim-linux.zip"
          echo "::notice::Stored release-linux in $AEROSIM_CI_ARTIFACT_RUN_DIR"
