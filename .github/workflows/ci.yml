name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install scons

      - name: Native unit test
        env:
          AEROSIM_REPLAY_ARTIFACT: build/replay_terminal_state.json
        run: scripts/test_native.sh

      - name: Upload Linux replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-linux
          path: build/replay_terminal_state.json

      - name: License scan
        run: scripts/test_license_scan.sh

      - name: License server API test
        run: python3 -m unittest license_server.test_license_server

      - name: Fetch Godot 4.7
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT_BIN=$(find /tmp/godot -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Fetch godot-cpp
        run: |
          git clone https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        run: GODOT_CPP_DIR=.deps/godot-cpp scons target=template_debug platform=linux

      - name: Headless smoke
        run: |
          scripts/run_headless_smoke.sh --output build/headless_smoke.json --csv-output build/headless_trajectory.csv --seconds 60
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["native_probe"])')" = "47"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["simulated_frames"])')" = "14400"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["desktop_substep_hz"])')" = "1000"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["desktop_substeps"])')" = "60000"
          test "$(python3 -c 'import json; print(json.load(open("build/headless_smoke.json"))["mobile_substeps_1s"])')" = "500"
          test -s build/headless_trajectory.csv
          python3 - <<'PY'
          import csv, json, math
          with open("build/headless_smoke.json", encoding="utf-8") as f:
              data = json.load(f)
          assert "KeyboardProfile" in data["input_fallback_status"]
          assert "non-sim" in data["input_fallback_status"]
          with open("build/headless_trajectory.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == data["simulated_frames"] == 14400
          last = rows[-1]
          assert abs(float(last["time_s"]) - 60.0) <= 1e-9
          assert int(float(last["substeps"])) == 60000
          qnorm = math.sqrt(sum(float(last[key]) ** 2 for key in (
              "orientation_x", "orientation_y", "orientation_z", "orientation_w"
          )))
          assert abs(qnorm - 1.0) <= 1e-6
          PY

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install scons

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Native unit test
        shell: bash
        env:
          AEROSIM_MSVC: "1"
          CXX: cl
          EXE_SUFFIX: .exe
          AEROSIM_REPLAY_ARTIFACT: build/replay_terminal_state.json
        run: scripts/test_native.sh

      - name: Upload Windows replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-windows
          path: build/replay_terminal_state.json

      - name: Fetch godot-cpp
        shell: bash
        run: |
          git clone https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        shell: bash
        run: GODOT_CPP_DIR=.deps/godot-cpp scons target=template_debug platform=windows

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_ROOT: ${{ github.workspace }}/.deps/android-ndk
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: python3 -m pip install scons

      - name: Install Android NDK
        run: |
          curl -L -o /tmp/android-ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          echo "22105e410cf29afcf163760cc95522b9fb981121  /tmp/android-ndk.zip" | sha1sum -c -
          unzip -q /tmp/android-ndk.zip -d .deps
          mv .deps/android-ndk-r27d "$ANDROID_NDK_ROOT"

      - name: Build Android native unit tests
        env:
          AEROSIM_RUN_NATIVE_TESTS: "0"
          CXX: ${{ github.workspace }}/.deps/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang++
        run: scripts/test_native.sh

      - name: Run Android native unit tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb shell mkdir -p /data/local/tmp/aerosim-tests
            for test_binary in build/tests/test_*; do
              adb push "$test_binary" /data/local/tmp/aerosim-tests/ >/dev/null
              adb shell chmod 755 "/data/local/tmp/aerosim-tests/$(basename "$test_binary")"
              adb shell "AEROSIM_REPLAY_ARTIFACT=/data/local/tmp/replay_terminal_state.json /data/local/tmp/aerosim-tests/$(basename "$test_binary")"
            done
            mkdir -p build
            adb pull /data/local/tmp/replay_terminal_state.json build/replay_terminal_state.json

      - name: Upload Android replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-android
          path: build/replay_terminal_state.json

      - name: Fetch godot-cpp
        run: |
          git clone https://github.com/godotengine/godot-cpp.git .deps/godot-cpp
          git -C .deps/godot-cpp checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        run: GODOT_CPP_DIR=.deps/godot-cpp scons target=template_debug platform=android arch=arm64 ANDROID_HOME=

  replay-compare:
    runs-on: ubuntu-latest
    needs: [linux, windows, android]
    steps:
      - uses: actions/checkout@v4

      - name: Download replay artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: build/replay-artifacts

      - name: Compare Linux and Windows replay terminal state
        run: |
          python3 scripts/compare_replay_artifacts.py \
            build/replay-artifacts/replay-linux/replay_terminal_state.json \
            build/replay-artifacts/replay-windows/replay_terminal_state.json
          python3 scripts/compare_replay_artifacts.py \
            build/replay-artifacts/replay-linux/replay_terminal_state.json \
            build/replay-artifacts/replay-android/replay_terminal_state.json
          python3 scripts/compare_replay_artifacts.py \
            build/replay-artifacts/replay-windows/replay_terminal_state.json \
            build/replay-artifacts/replay-android/replay_terminal_state.json
