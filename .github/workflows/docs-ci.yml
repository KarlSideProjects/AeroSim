name: Docs CI

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
      - '.out-of-scope/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.out-of-scope/**'

jobs:
  docs:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown relative links
        run: python3 scripts/check_docs.py
