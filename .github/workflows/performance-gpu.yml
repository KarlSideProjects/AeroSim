name: G0.1/G3.7 Local Ubuntu Gate

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: aerosim-performance-gpu
  cancel-in-progress: false

jobs:
  gate:
    runs-on: [self-hosted, Linux, X64, aerosim-7945hx-4060ti]
    timeout-minutes: 60
    steps:
      - name: Clean self-hosted workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" ubuntu:24.04 \
            bash -lc 'find /work -mindepth 1 -maxdepth 1 -exec rm -rf {} +'

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Set job-local tool and artifact paths
        run: |
          tool_root="$RUNNER_TEMP/aerosim-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          rm -rf "$tool_root"
          mkdir -p "$tool_root"
          repo_key="${GITHUB_REPOSITORY//\//-}"
          artifact_root="${AEROSIM_CI_ARTIFACT_ROOT:-$HOME/aerosim-ci-artifacts}"
          artifact_run_dir="$artifact_root/$repo_key/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$artifact_run_dir"
          {
            echo "AEROSIM_TOOL_ROOT=$tool_root"
            echo "AEROSIM_CI_ARTIFACT_RUN_DIR=$artifact_run_dir"
            echo "XDG_CACHE_HOME=$tool_root/xdg-cache"
            echo "XDG_CONFIG_HOME=$tool_root/xdg-config"
            echo "XDG_DATA_HOME=$tool_root/xdg-data"
            echo "GODOT_CPP_DIR=$tool_root/godot-cpp"
          } >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          python3 -m venv build/scons-venv
          build/scons-venv/bin/python -m pip install --upgrade pip
          build/scons-venv/bin/python -m pip install scons
          echo "$PWD/build/scons-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Godot 4.7
        run: |
          godot_dir="$AEROSIM_TOOL_ROOT/godot"
          godot_zip="$AEROSIM_TOOL_ROOT/godot.zip"
          curl -L -o "$godot_zip" https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  $godot_zip" | sha256sum -c -
          unzip -q "$godot_zip" -d "$godot_dir"
          echo "GODOT_BIN=$(find "$godot_dir" -type f -name 'Godot*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Fetch pinned godot-cpp
        run: |
          git clone https://github.com/godotengine/godot-cpp.git "$GODOT_CPP_DIR"
          git -C "$GODOT_CPP_DIR" checkout ba0edfed90512ec64aba51d4295a3e7e30112f86

      - name: Build GDExtension
        run: scons target=template_debug platform=linux

      - name: Record Linux debug artifact provenance
        run: |
          artifact=build/native_debug_artifact.json
          extension=bin/libaerosim_native.linux.template_debug.x86_64.so
          test -s "$extension"
          native_source_sha256="$({ find src/native -type f -print0; printf 'SConstruct\0'; } | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          python3 - "$artifact" "$extension" "$(git rev-parse HEAD)" "$native_source_sha256" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          artifact = Path(sys.argv[1])
          extension = Path(sys.argv[2])
          artifact.parent.mkdir(parents=True, exist_ok=True)
          artifact.write_text(json.dumps({
              "commit_sha": sys.argv[3],
              "gdextension_path": str(extension),
              "gdextension_sha256": hashlib.sha256(extension.read_bytes()).hexdigest(),
              "native_source_sha256": sys.argv[4],
          }, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Run full local-Ubuntu G0.1 gate protocol
        env:
          AEROSIM_REQUIRED_GPU_ADAPTER: NVIDIA GeForce RTX 4060 Ti
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: |
          mkdir -p build/performance-gpu
          (
            flock -w 1800 9
            scripts/run_performance_benchmark.sh \
              --effects off \
              --output build/performance-gpu/effects-off.json
            scripts/run_performance_benchmark.sh \
              --effects on \
              --baseline-report build/performance-gpu/effects-off.json \
              --output build/performance-gpu/effects-on.json
          ) 9>"$HOME/.aerosim-performance-gpu.lock"
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_effects = {
              "off": [],
              "on": ["A3_drag", "A4_ground_effect", "A5_downwash", "A6_propwash"],
          }
          for mode, effects in expected_effects.items():
              report = json.loads(Path(f"build/performance-gpu/effects-{mode}.json").read_text())
              assert report["sample_count"] == 14_400
              assert report["gate"] == "G0.1"
              assert report["gate_eligible"] is True
              assert report["gate_verdict"] == "pass"
              assert report["reference_only"] is False
              assert report["measurement"]["video_adapter"] == "NVIDIA GeForce RTX 4060 Ti"
              assert report["environment"]["os_release"] == "Ubuntu 26.04 LTS"
              assert report["environment"]["nvidia_driver_version"] == "580.159.03"
              assert report["measurement"]["active_effects"] == effects
              if mode == "on":
                  assert all(
                      evidence["observed"]
                      for evidence in report["measurement"]["effect_evidence"].values()
                  )
          candidate = json.loads(Path("build/performance-gpu/effects-on.json").read_text())
          assert candidate["comparison_to_baseline"]["g3_7_verdict"] == "pass"
          assert candidate["comparison_to_baseline"]["g3_7_p99_within_limit"] is True
          assert candidate["comparison_to_baseline"]["g3_7_increase_within_limit"] is True
          PY

      - name: Run GPU-A reset and respawn P99 gate
        env:
          AEROSIM_REQUIRED_GPU_ADAPTER: NVIDIA GeForce RTX 4060 Ti
          AEROSIM_NATIVE_PROVENANCE: build/native_debug_artifact.json
        run: |
          scripts/run_reset_respawn_benchmark.sh \
            --output build/performance-gpu/reset-respawn.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/performance-gpu/reset-respawn.json").read_text())
          assert report["gate"] == "G4B.2/G4B.UI3"
          assert report["sample_count"] == 400
          assert report["trials_per_path"] == 200
          assert report["p99_ms"]["plain_x_reset"] <= 1500.0
          assert report["p99_ms"]["pause_overlay_reset"] <= 1500.0
          assert report["endpoint_contract"]["armed_preserved"] is True
          assert report["endpoint_contract"]["pause_off"] is True
          assert report["endpoint_contract"]["nonzero_throttle_accepted_by_native_telemetry"] is True
          assert report["video_adapter"] == "NVIDIA GeForce RTX 4060 Ti"
          PY

      - name: Write GPU performance artifact manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          directory = Path("build/performance-gpu")
          reports = {
              mode: json.loads((directory / f"effects-{mode}.json").read_text())
              for mode in ("off", "on")
          }
          reset_report = json.loads((directory / "reset-respawn.json").read_text())
          provenance = {
              mode: {
                  "commit_sha": report["environment"]["git_revision"],
                  "gdextension_sha256": report["measurement"]["gdextension_sha256"],
                  "native_source_sha256": report["measurement"]["native_source_sha256"],
              }
              for mode, report in reports.items()
          }
          if provenance["off"] != provenance["on"]:
              raise SystemExit("effects reports do not share one native-artifact receipt")
          reset_provenance = {
              "commit_sha": reset_report["commit_sha"],
              "gdextension_sha256": reset_report["gdextension_sha256"],
              "native_source_sha256": reset_report["native_source_sha256"],
          }
          if reset_provenance != provenance["off"]:
              raise SystemExit("reset report does not share the effects native-artifact receipt")
          (directory / "manifest.json").write_text(json.dumps({
              "schema_version": 1,
              "provenance": provenance["off"],
              "artifacts": {
                  **{mode: f"effects-{mode}.json" for mode in ("off", "on")},
                  "reset_respawn": "reset-respawn.json",
              },
              "reset_respawn_gate": {
                  "gate": reset_report["gate"],
                  "sample_count": reset_report["sample_count"],
                  "p99_ms": reset_report["p99_ms"],
              },
          }, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Store GPU performance artifacts locally
        if: always()
        run: |
          destination="$AEROSIM_CI_ARTIFACT_RUN_DIR/performance-gpu"
          install -d "$destination"
          test -s build/performance-gpu/manifest.json
          if compgen -G 'build/performance-gpu/*.json' > /dev/null; then
            cp build/performance-gpu/*.json "$destination/"
          fi
          if compgen -G 'build/performance-gpu/*.svg' > /dev/null; then
            cp build/performance-gpu/*.svg "$destination/"
          fi
          echo "::notice::Stored performance-gpu artifacts in $destination"
