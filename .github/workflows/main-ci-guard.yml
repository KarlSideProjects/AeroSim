name: Main CI Guard

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  report-red-main:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Open bug issue for red main
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const shortSha = run.head_sha.slice(0, 7);
            const title = `main post-merge CI 紅燈 @ ${shortSha} — 立即修復或 revert`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${shortSha}`,
            });
            if (search.data.total_count > 0) {
              core.info(`已存在 ${shortSha} 的紅燈 issue，略過`);
              return;
            }
            const body = [
              '> *This was generated by AI during triage.*（Main CI Guard 自動開立）',
              '',
              `main 的 post-merge CI 失敗：commit \`${run.head_sha}\``,
              '',
              `- 失敗 run：${run.html_url}`,
              `- Head commit：${run.head_commit ? run.head_commit.message.split('\n')[0] : '(unknown)'}`,
              '',
              '## 處理規則（#56 第 5 節）',
              '',
              '紅燈 main 是最高優先。造成紅燈的 agent（或最先看到本 issue 的 agent）必須：',
              '1. 立即修復 forward，或 revert 該 merge。',
              '2. 修復 PR 依標準紀律：`gh pr checks --watch --fail-fast` 全綠後才 `gh pr merge --squash`。',
              '3. main 回綠後關閉本 issue，並在此留言附上綠燈 run 連結。',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['bug', 'needs-triage'],
              body,
            });
