<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroSim Ground Station Panel</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
body { margin: 0; min-width: 320px; background: #111820; color: #dce7f5; }
main { max-width: 720px; margin: 0 auto; padding: 24px; }
header { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
h1 { margin: 0; font-size: 1.25rem; }
p { color: #9fb0c5; line-height: 1.5; }
.status { border: 1px solid #31445d; border-radius: 8px; padding: 16px; margin-top: 24px; }
.badge { color: #9ee6b1; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
code { color: #b9d8ff; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<header>
<h1>AeroSim Ground Station Panel</h1>
<span class="badge" id="focus-state">panel focus</span>
</header>
<section class="status" aria-live="polite">
<strong>Launch qualified</strong>
<p>This dependency-free panel is running as an independent native Wayland client.</p>
<p id="session">No session fragment was supplied.</p>
</section>
</main>
<script>
(function () {
  var session = document.getElementById("session");
  var focusState = document.getElementById("focus-state");
  var protocolVersion = 2;
  var fragment = new URLSearchParams(window.location.hash.slice(1));
  var port = Number(fragment.get("port"));
  var token = fragment.get("token") || "";
  var socket = null;
  var pingSequence = 1;
  var pingTimer = null;
  function setSession(value) {
    session.textContent = value;
  }
  function closeSession() {
    if (pingTimer !== null) window.clearInterval(pingTimer);
    pingTimer = null;
    socket = null;
  }
  function sendPing() {
    if (socket === null || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({
      v: protocolVersion,
      t: "ping",
      seq: pingSequence++,
      d: { client_timestamp_ms: performance.now(), request: "panel" }
    }));
  }
  if (port < 8765 || port > 8769 || !/^[0-9a-f]{32}$/i.test(token)) {
    setSession("No valid GSP session fragment was supplied.");
  } else {
    socket = new WebSocket("ws://127.0.0.1:" + port);
    socket.addEventListener("open", function () {
      setSession("Authenticating GSP session…");
      socket.send(JSON.stringify({ v: protocolVersion, t: "auth", seq: 0, d: { token: token } }));
    });
    socket.addEventListener("message", function (event) {
      var envelope;
      try { envelope = JSON.parse(event.data); } catch (_error) { closeSession(); setSession("Invalid GSP response."); return; }
      if (envelope.v !== protocolVersion || typeof envelope.t !== "string" || !envelope.d) {
        closeSession();
        setSession("Invalid GSP protocol response.");
        return;
      }
      if (envelope.t === "hello") {
        setSession("Authenticated: " + (envelope.d.vehicle_instance || "session"));
        pingTimer = window.setInterval(sendPing, 250);
        sendPing();
      } else if (envelope.t === "pong") {
        setSession("Connected: pong from " + (envelope.d.peer || "AeroSim"));
      }
    });
    socket.addEventListener("close", function () { closeSession(); setSession("GSP session closed."); });
    socket.addEventListener("error", function () { closeSession(); setSession("GSP session unavailable."); });
  }
  function setFocusState(value) {
    focusState.textContent = value;
    document.title = "AeroSim GSP — " + value;
  }
  window.addEventListener("focus", function () { setFocusState("panel focus"); });
  window.addEventListener("blur", function () { setFocusState("panel unfocused"); });
}());
</script>
</body>
</html>
